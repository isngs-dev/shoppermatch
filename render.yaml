# Render Blueprint — creates the backend web service + a managed Postgres
# database in one go. In the Render dashboard: New + -> Blueprint -> point at
# this repo. Builds from the root Dockerfile (same single image used for
# Railway/local docker compose); Postgres connectionString is wired in
# automatically and normalized to the asyncpg driver by config.py.
#
# Free-tier web services spin down after ~15 min idle and cold-start on the
# next request — background workers (email outbox, automation scheduler)
# pause while spun down. Fine for a demo; upgrade the plan for anything that
# needs to keep running/sending in the background continuously.
services:
  - type: web
    name: shoppermatch-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shoppermatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_ADMIN_EMAIL
        value: admin@isn.com
      - key: DEMO_ADMIN_PASSWORD
        value: isn-demo-2026
      # Set this to the service's actual onrender.com URL (or a custom
      # domain) after the first deploy — it's embedded in emailed tracking/
      # pixel/shopper links, so it must match the real public origin.
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: shoppermatch-db
    plan: free
