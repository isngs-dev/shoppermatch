# Render Blueprint — creates the backend web service + a managed Postgres
# database in one go. In the Render dashboard: New + -> Blueprint -> point at
# this repo. Builds from the root Dockerfile (same single image used for
# Railway/local docker compose); Postgres connectionString is wired in
# automatically and normalized to the asyncpg driver by config.py.
#
# Plan changes here only take effect when you Sync this Blueprint from the
# Render dashboard — editing this file alone never charges anything. The
# actual paid upgrade (and its charge) happens when you confirm it in Render's
# UI. "2c-4g" (web) / "0.1c-256mb" (db) are Render's current plan identifiers
# for what the dashboard still labels "Pro" (web) and "Basic-256mb" (Postgres)
# as of this writing — double-check against the live dashboard before syncing,
# since Render's plan names/specs do change.
services:
  - type: web
    name: shoppermatch-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 2c-4g
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shoppermatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_ADMIN_EMAIL
        value: admin@isn.com
      - key: DEMO_ADMIN_PASSWORD
        value: isn-demo-2026
      # Set this to the service's actual onrender.com URL (or a custom
      # domain) after the first deploy — it's embedded in emailed tracking/
      # pixel/shopper links, so it must match the real public origin.
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: shoppermatch-db
    plan: 0.1c-256mb
