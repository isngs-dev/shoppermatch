  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

utline-offset:2px; border-radius:6px;}\r\n<\u002Fstyle>\r\n\r\n\r\n<\u002Fhead><body><a class=\"skip-link\" href=\"#main-content\">Skip to main content<\u002Fa>\r\n<div class=\"app\">\r\n  <aside class=\"rail\">\r\n    <div class=\"rail-brand\">\r\n      <div class=\"mark\">ShopperMatch.AI<\u002Fdiv>\r\n      <div class=\"sub\">Product Architecture &amp; MVP<\u002Fdiv>\r\n    <\u002Fdiv>\r\n    <nav id=\"rail-nav\" aria-label=\"Sections\">\r\n      <button class=\"rail-btn active\" aria-current=\"page\" data-rail=\"01\"><span class=\"num\">01<\u002Fspan><span>Cover<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"02\"><span class=\"num\">02<\u002Fspan><span>Product Architecture<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"03\"><span class=\"num\">03<\u002Fspan><span>User Roles<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"04\"><span class=\"num\">04<\u002Fspan><span>Shopper Match<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"05\"><span class=\"num\">05<\u002Fspan><span>Outreach Workflow<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"06\"><span class=\"num\">06<\u002Fspan><span>Email Automation<\u002Fspan><\u002Fbutton>\r\n      <button class=\"rail-btn\" data-rail=\"07\"><span class=\"num\">07<\u002Fspan><span>Pending Features<\u002Fspan><\u002Fbutton>\r\n    <\u002Fnav>\r\n    <div class=\"rail-foot\">7 sections.<br>Modelled 1:1 on the review notes.<\u002Fdiv>\r\n  <\u002Faside>\r\n\r\n  <main class=\"main\" id=\"main-content\">\r\n    <div class=\"canvas-header\">\r\n      <div class=\"crumb\" id=\"crumb\" role=\"status\" aria-live=\"polite\"><b>01 — Cover<\u002Fb><\u002Fdiv>\r\n      <div class=\"frame-switch\" id=\"frame-switch-slot\" role=\"tablist\" aria-label=\"Frames in this section\"><\u002Fdiv>\r\n    <\u002Fdiv>\r\n\r\n    <div class=\"canvas\">\r\n\r\n      <!-- 01 COVER -->\r\n      <section class=\"panel active\" id=\"panel-01\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 01 · Cover<\u002Fdiv>\r\n        <div class=\"board\">\r\n          <div class=\"eyebrow\">Architecture &amp; MVP walkthrough<\u002Fdiv>\r\n          <h1 class=\"h1\">ShopperMatch.AI<\u002Fh1>\r\n          <p class=\"lede\">Three experiences, one backend. This deck maps how the ISN admin, a third-party client (HS Global), and a field shopper (Sarah Johnson) each move through the same campaign — from AI matching to a signed, timestamped acceptance.<\u002Fp>\r\n          <div style=\"display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;\">\r\n            <span class=\"chip\">FastAPI · SQL · AI · SendGrid · SASSIE<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <div class=\"toc\">\r\n            <button data-goto=\"02,\">02 · Product Architecture<\u002Fbutton>\r\n            <button data-goto=\"03,\">03 · User Roles<\u002Fbutton>\r\n            <button data-goto=\"04,\">04 · End-to-End Workflows<\u002Fbutton>\r\n            <button data-goto=\"05,\">05 · Outreach Workflow<\u002Fbutton>\r\n            <button data-goto=\"06,\">06 · Email Automation Workflow<\u002Fbutton>\r\n          <\u002Fdiv>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n      <!-- 02 PRODUCT ARCHITECTURE -->\r\n      <section class=\"panel\" id=\"panel-02\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 02 · Product Architecture<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">System map<\u002Fdiv>\r\n          <h2 class=\"h2\">One backend, two portals, one funnel<\u002Fh2>\r\n          <figure style=\"margin:18px 0 0;\">\r\n            <svg viewBox=\"0 0 1100 640\" role=\"img\" aria-label=\"Both portals call one FastAPI backend which reads and writes SQL, ranks candidates via the AI engine, and calls external integrations; SendGrid sends the shopper email, and the shopper funnel writes acceptance events back into the same database.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n              <defs>\r\n                <marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\r\n                  <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath>\r\n                <\u002Fmarker>\r\n              <\u002Fdefs>\r\n              <!-- portals -->\r\n              <rect x=\"60\" y=\"36\" width=\"270\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"195\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--text)\">ISN ADMIN PORTAL<\u002Ftext>\r\n              <text x=\"195\" y=\"78\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Dashboard · Tracking · Audit · Integrations<\u002Ftext>\r\n\r\n              <rect x=\"390\" y=\"36\" width=\"270\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"525\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--text)\">CLIENT PORTAL<\u002Ftext>\r\n              <text x=\"525\" y=\"78\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"currentColor\">Campaigns · Shops · Shoppers · Outreach<\u002Ftext>\r\n\r\n              <!-- backend -->\r\n              <rect x=\"170\" y=\"188\" width=\"380\" height=\"58\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"360\" y=\"212\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--accent)\">FASTAPI BACKEND<\u002Ftext>\r\n              <text x=\"360\" y=\"230\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--accent)\">shared by both portals<\u002Ftext>\r\n\r\n              <line x1=\"195\" y1=\"94\" x2=\"330\" y2=\"188\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n              <text x=\"220\" y=\"150\" font-size=\"10.5\" fill=\"currentColor\">manages<\u002Ftext>\r\n              <line x1=\"525\" y1=\"94\" x2=\"395\" y2=\"188\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n              <text x=\"470\" y=\"150\" font-size=\"10.5\" fill=\"currentColor\">manages<\u002Ftext>\r\n\r\n              <!-- subsystems -->\r\n              <rect x=\"70\" y=\"330\" width=\"170\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"155\" y=\"354\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">SQL DATABASE<\u002Ftext>\r\n              <text x=\"155\" y=\"371\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">shoppers · shops · events<\u002Ftext>\r\n\r\n              <rect x=\"275\" y=\"330\" width=\"170\" height=\"58\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect>\r\n              <text x=\"360\" y=\"354\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ai-ink)\">AI ENGINE<\u002Ftext>\r\n              <text x=\"360\" y=\"371\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ai-ink)\">semantic match + rank<\u002Ftext>\r\n\r\n              <rect x=\"480\" y=\"330\" width=\"200\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"580\" y=\"354\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">INTEGRATIONS<\u002Ftext>\r\n              <text x=\"580\" y=\"371\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\">SASSIE · SendGrid · Maps<\u002Ftext>\r\n\r\n              <line x1=\"280\" y1=\"246\" x2=\"180\" y2=\"330\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n              <text x=\"185\" y=\"300\" font-size=\"10.5\" fill=\"currentColor\">reads\u002Fwrites<\u002Ftext>\r\n              <line x1=\"360\" y1=\"246\" x2=\"360\" y2=\"330\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n              <text x=\"368\" y=\"295\" font-size=\"10.5\" fill=\"currentColor\">ranks<\u002Ftext>\r\n              <line x1=\"440\" y1=\"246\" x2=\"560\" y2=\"330\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n              <text x=\"500\" y=\"300\" font-size=\"10.5\" fill=\"currentColor\">calls<\u002Ftext>\r\n\r\n              <!-- shopper funnel lane -->\r\n              <rect x=\"800\" y=\"36\" width=\"160\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"880\" y=\"63\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">SHOPPER<\u002Ftext>\r\n              <line x1=\"880\" y1=\"82\" x2=\"880\" y2=\"112\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n\r\n              <rect x=\"800\" y=\"114\" width=\"160\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"880\" y=\"141\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">EMAIL INVITE<\u002Ftext>\r\n              <line x1=\"880\" y1=\"160\" x2=\"880\" y2=\"190\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n\r\n              <rect x=\"800\" y=\"192\" width=\"160\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"880\" y=\"219\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">TRACKING LINK<\u002Ftext>\r\n              <line x1=\"880\" y1=\"238\" x2=\"880\" y2=\"268\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n\r\n              <rect x=\"800\" y=\"270\" width=\"160\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"880\" y=\"297\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">ASSIGNMENT<\u002Ftext>\r\n              <line x1=\"880\" y1=\"316\" x2=\"880\" y2=\"346\" stroke=\"currentColor\" marker-end=\"url(#arrow)\"><\u002Fline>\r\n\r\n              <rect x=\"800\" y=\"348\" width=\"70\" height=\"46\" rx=\"8\" fill=\"var(--success-soft)\" stroke=\"var(--success)\"><\u002Frect>\r\n              <text x=\"835\" y=\"375\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--success)\">ACCEPT<\u002Ftext>\r\n              <rect x=\"890\" y=\"348\" width=\"70\" height=\"46\" rx=\"8\" fill=\"var(--danger-soft)\" stroke=\"var(--danger)\"><\u002Frect>\r\n              <text x=\"925\" y=\"375\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--danger)\">DECLINE<\u002Ftext>\r\n\r\n              <!-- send + writeback -->\r\n              <path d=\"M680,359 C740,320 760,180 800,137\" fill=\"none\" stroke=\"var(--ai)\" stroke-dasharray=\"4 4\" marker-end=\"url(#arrow)\"><\u002Fpath>\r\n              <text x=\"705\" y=\"230\" font-size=\"10.5\" fill=\"var(--ai-ink)\">SendGrid sends<\u002Ftext>\r\n\r\n              <path d=\"M835,394 C760,470 300,470 155,388\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" marker-end=\"url(#arrow)\"><\u002Fpath>\r\n              <text x=\"330\" y=\"480\" font-size=\"10.5\" fill=\"currentColor\">writes acceptance event<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>Both portals call one FastAPI backend, which owns the SQL database, the AI ranking engine, and the outbound integrations. The shopper funnel runs in parallel on the right: SendGrid dispatches the email, and every step — sent through accepted\u002Fdeclined — writes back into the same database that ISN Tracking reads from.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n      <!-- 03 USER ROLES -->\r\n      <section class=\"panel\" id=\"panel-03\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 03 · User Roles<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">Who sees what<\u002Fdiv>\r\n          <h2 class=\"h2\">Three roles, three altitudes<\u002Fh2>\r\n          <div class=\"grid grid-3\" style=\"margin-top:18px;\">\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\">ISN Admin<\u002Fh3>\r\n              <p class=\"muted\" style=\"font-size:12.5px; margin-top:2px;\">Platform operations<\u002Fp>\r\n              <ul class=\"checklist\" style=\"margin-top:14px;\">\r\n                <li>Technical monitoring<\u002Fli><li>Attribution &amp; tracking<\u002Fli><li>Audit logs<\u002Fli><li>Integrations<\u002Fli><li>System health<\u002Fli><li>Settings<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\">Third-Party Client<\u002Fh3>\r\n              <p class=\"muted\" style=\"font-size:12.5px; margin-top:2px;\">Campaign operations — e.g. HS Global<\u002Fp>\r\n              <ul class=\"checklist\" style=\"margin-top:14px;\">\r\n                <li>Campaigns<\u002Fli><li>Shops<\u002Fli><li>Shoppers<\u002Fli><li>AI recommendations<\u002Fli><li>Outreach<\u002Fli><li>Campaign tracking<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\">Shopper<\u002Fh3>\r\n              <p class=\"muted\" style=\"font-size:12.5px; margin-top:2px;\">Field participant — e.g. Sarah Johnson<\u002Fp>\r\n              <ul class=\"checklist\" style=\"margin-top:14px;\">\r\n                <li>Receives email invite<\u002Fli><li>Opens tracking link<\u002Fli><li>Views assignment<\u002Fli><li>Accepts \u002F declines<\u002Fli><li>Completes assignment<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n      <!-- 04 WORKFLOWS -->\r\n      <section class=\"panel\" id=\"panel-04\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 04 · End-to-End Workflows<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">Pipeline<\u002Fdiv>\r\n          <h2 class=\"h2\">Campaign → shopper → database, in fourteen hops<\u002Fh2>\r\n          <figure style=\"margin-top:16px;\">\r\n            <svg viewBox=\"0 0 1160 300\" role=\"img\" aria-label=\"A campaign moves through shop selection, AI recommendation, shopper selection, outreach, email templating, invitation generation, SendGrid, email delivery, tracking link, the shopper, assignment, accept or decline, the database, and finally client status.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n              <defs>\r\n                <marker id=\"arrow2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker>\r\n              <\u002Fdefs>\r\n              <!-- row 1 -->\r\n              <!-- generate 7 boxes row1, 7 boxes row2 -->\r\n              <g id=\"row1\"><\u002Fg>\r\n            <\u002Fsvg>\r\n            <div id=\"wf-render\"><\u002Fdiv>\r\n          <\u002Ffigure>\r\n          <figcaption id=\"wf-caption\"><\u002Ffigcaption>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Email sub-events run in parallel<\u002Fh3>\r\n          <figure style=\"margin-top:12px;\">\r\n            <svg viewBox=\"0 0 780 210\" role=\"img\" aria-label=\"Once the email is sent, it passes through delivered, opened, clicked, visited and accepted states; every state change is written to ISN tracking and the audit log.\" style=\"width:100%; max-width:640px; height:auto; color:var(--text-muted);\">\r\n              <defs><marker id=\"arrow3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n              <rect x=\"10\" y=\"80\" width=\"90\" height=\"44\" rx=\"7\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"55\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">EMAIL<\u002Ftext>\r\n              <line x1=\"100\" y1=\"102\" x2=\"140\" y2=\"102\" stroke=\"currentColor\" marker-end=\"url(#arrow3)\"><\u002Fline>\r\n              <g font-size=\"10.5\" fill=\"currentColor\">\r\n                <rect x=\"142\" y=\"10\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"197\" y=\"30\" text-anchor=\"middle\">SENT<\u002Ftext>\r\n                <rect x=\"142\" y=\"50\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"197\" y=\"70\" text-anchor=\"middle\">DELIVERED<\u002Ftext>\r\n                <rect x=\"142\" y=\"90\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"197\" y=\"110\" text-anchor=\"middle\">OPENED<\u002Ftext>\r\n                <rect x=\"142\" y=\"130\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"197\" y=\"150\" text-anchor=\"middle\">CLICKED<\u002Ftext>\r\n                <rect x=\"142\" y=\"170\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"197\" y=\"190\" text-anchor=\"middle\">VISITED \u002F ACCEPTED<\u002Ftext>\r\n              <\u002Fg>\r\n              <line x1=\"252\" y1=\"25\" x2=\"420\" y2=\"95\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"65\" x2=\"420\" y2=\"97\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"105\" x2=\"420\" y2=\"99\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"145\" x2=\"420\" y2=\"101\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"185\" x2=\"420\" y2=\"103\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <rect x=\"420\" y=\"80\" width=\"130\" height=\"44\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"485\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--accent)\">ISN TRACKING<\u002Ftext>\r\n              <line x1=\"550\" y1=\"102\" x2=\"600\" y2=\"102\" stroke=\"currentColor\" marker-end=\"url(#arrow3)\"><\u002Fline>\r\n              <rect x=\"602\" y=\"80\" width=\"130\" height=\"44\" rx=\"7\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"667\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">AUDIT LOG<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>Every state a message passes through — delivered, opened, clicked, visited, accepted — lands in ISN Tracking first, then the audit log, so a client's \"6 accepted\" number and ISN's timeline always agree.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n\r\n      <!-- 05 EMAIL AUTOMATION -->\r\n      <section class=\"panel\" id=\"panel-06\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 06 · Email Automation Workflow<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">Email Outreach Automation<\u002Fdiv>\r\n          <h2 class=\"h2\">Automated outreach, one shopper state at a time<\u002Fh2>\r\n          <p class=\"lede\">ShopperMatch.AI automatically sends invitation and reminder emails to shoppers on ACTIVE and UPCOMING campaigns. The workflow is shopper-specific — one shopper accepting, declining, clicking or visiting affects only that shopper's automation state, and never stops automation for anyone else on the same campaign.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">System map<\u002Fh3>\r\n          <figure style=\"margin-top:14px;\">\r\n            <svg viewBox=\"0 0 952 172\" role=\"img\" aria-label=\"Client Portal to Campaign to Selected Shops to Email Template to Automation Engine, then Personalized Invitation to SendGrid to Shopper Email to Tracking Link to Shopper Assignment.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n  <defs><marker id=\"armap\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n<rect x=\"12\" y=\"20\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"96\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">CLIENT PORTAL<\u002Ftext>\r\n<rect x=\"202\" y=\"20\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"286\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">CAMPAIGN<\u002Ftext>\r\n<rect x=\"392\" y=\"20\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"476\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">SELECTED SHOPS<\u002Ftext>\r\n<rect x=\"582\" y=\"20\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"666\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">EMAIL TEMPLATE<\u002Ftext>\r\n<rect x=\"772\" y=\"20\" width=\"168\" height=\"46\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect><text x=\"856\" y=\"42\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ai-ink)\">AUTOMATION<\u002Ftext><text x=\"856\" y=\"56\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--ai-ink)\">ENGINE<\u002Ftext>\r\n<rect x=\"12\" y=\"110\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"96\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">PERSONALIZED<\u002Ftext><text x=\"96\" y=\"146\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">INVITATION<\u002Ftext>\r\n<rect x=\"202\" y=\"110\" width=\"168\" height=\"46\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"286\" y=\"137\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--accent)\">SENDGRID<\u002Ftext>\r\n<rect x=\"392\" y=\"110\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"476\" y=\"137\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">SHOPPER EMAIL<\u002Ftext>\r\n<rect x=\"582\" y=\"110\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"666\" y=\"137\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">TRACKING LINK<\u002Ftext>\r\n<rect x=\"772\" y=\"110\" width=\"168\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"856\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">SHOPPER<\u002Ftext><text x=\"856\" y=\"146\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">ASSIGNMENT<\u002Ftext>\r\n<line x1=\"180\" y1=\"43\" x2=\"202\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"370\" y1=\"43\" x2=\"392\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"560\" y1=\"43\" x2=\"582\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"750\" y1=\"43\" x2=\"772\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<path d=\"M856,66 C856,91 96,85 96,110\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fpath>\r\n<line x1=\"180\" y1=\"133\" x2=\"202\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"370\" y1=\"133\" x2=\"392\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"560\" y1=\"133\" x2=\"582\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<line x1=\"750\" y1=\"133\" x2=\"772\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#armap)\"><\u002Fline>\r\n<\u002Fsvg>\r\n            <figcaption>Client Portal selects a campaign, which connects directly to its selected shops; the email template and automation engine turn that into a personalized invitation. SendGrid delivers it, and the tracking link identifies the shopper's assignment, writing every response back into the shared database.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Shopper-level automation state<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13px; margin-top:6px; max-width:70ch;\">The automation engine does not track one state per campaign — it tracks one independent state per selected shopper. A ten-shopper campaign can be running ten different automation states at once.<\u002Fp>\r\n          <div class=\"flow-row\" style=\"margin-top:16px;\">\r\n            <div class=\"flow-box\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">10 SELECTED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">SHOPPER-LEVEL AUTOMATION STATE<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"card\" style=\"margin-top:14px; padding:6px 20px;\">\r\n            <table>\r\n              <thead><tr><th>Shopper<\u002Fth><th>Automation state<\u002Fth><\u002Ftr><\u002Fthead>\r\n              <tbody>\r\n                <tr><td>Sarah<\u002Ftd><td><span class=\"pill pill-completed\">Active<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Rakesh<\u002Ftd><td><span class=\"pill pill-pending\">Waiting<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Karan<\u002Ftd><td><span class=\"pill pill-active\">Accepted<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Rahul<\u002Ftd><td><span class=\"pill pill-pending\">Reminder due<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Amit<\u002Ftd><td><span class=\"pill pill-failed\">Declined<\u002Fspan><\u002Ftd><\u002Ftr>\r\n              <\u002Ftbody>\r\n            <\u002Ftable>\r\n          <\u002Fdiv>\r\n          <div class=\"stack-note\" style=\"margin-top:12px;\"><b>Note —<\u002Fb> the system maintains <span class=\"sw\">campaign-level automation<\u002Fspan> (which shoppers are enrolled, which template, which schedule) <b>and<\u002Fb> <span class=\"sw\">shopper-level automation state<\u002Fspan> (each shopper's own step, next-action time and history) as two separate layers.<\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Email template flow<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box accent\">EMAIL TEMPLATE<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"flow-branch\">\r\n            <div class=\"flow-branch-row\"><div class=\"flow-box sm\">Initial Invitation<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"flow-branch-row\"><div class=\"flow-box sm\">Reminder<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"flow-branch-row\"><div class=\"flow-box sm\">Final Reminder<\u002Fdiv><\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div style=\"display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;\">\r\n            <span class=\"chip\">{{shopper_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{campaign_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{shop_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{location}}<\u002Fspan>\r\n            <span class=\"chip\">{{compensation}}<\u002Fspan>\r\n            <span class=\"chip\">{{deadline}}<\u002Fspan>\r\n            <span class=\"chip\">{{assignment_link}}<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <div class=\"flow-row\" style=\"margin-top:16px;\">\r\n            <div class=\"flow-box sm\">Template<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Shopper Data<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Campaign Data<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Shop Data<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box success\">PERSONALIZED EMAIL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Real SendGrid integration<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box ai\">AUTOMATION ENGINE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">EMAIL SERVICE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">REAL EMAIL<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">SHOPPER<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"stack-note\" style=\"margin-top:12px;\"><b>Not a mock —<\u002Fb> this reuses the existing SendGrid integration already wired into ShopperMatch.AI; every email in this workflow is a real outbound send, not a simulated one.<\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Email event tracking<\u002Fh3>\r\n          <figure style=\"margin-top:12px;\">\r\n            <svg viewBox=\"0 0 780 230\" role=\"img\" aria-label=\"SendGrid emits sent, delivered, opened, clicked, bounced and dropped events, which flow through the tracking API and webhook into the SQL database, back to the automation engine, and into ISN admin tracking.\" style=\"width:100%; max-width:700px; height:auto; color:var(--text-muted);\">\r\n              <defs><marker id=\"armap5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n              <rect x=\"10\" y=\"92\" width=\"100\" height=\"44\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"60\" y=\"118\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--accent)\">SENDGRID<\u002Ftext>\r\n              <line x1=\"110\" y1=\"114\" x2=\"150\" y2=\"114\" stroke=\"currentColor\" marker-end=\"url(#armap5)\"><\u002Fline>\r\n              <g font-size=\"10\" font-weight=\"600\" fill=\"currentColor\">\r\n                <rect x=\"152\" y=\"6\" width=\"100\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"202\" y=\"25\" text-anchor=\"middle\">SENT<\u002Ftext>\r\n                <rect x=\"152\" y=\"40\" width=\"100\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"202\" y=\"59\" text-anchor=\"middle\">DELIVERED<\u002Ftext>\r\n                <rect x=\"152\" y=\"74\" width=\"100\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"202\" y=\"93\" text-anchor=\"middle\">OPENED<\u002Ftext>\r\n                <rect x=\"152\" y=\"108\" width=\"100\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"202\" y=\"127\" text-anchor=\"middle\">CLICKED<\u002Ftext>\r\n                <rect x=\"152\" y=\"142\" width=\"100\" height=\"28\" rx=\"6\" fill=\"var(--danger-soft)\" stroke=\"var(--danger)\"><\u002Frect><text x=\"202\" y=\"161\" text-anchor=\"middle\" fill=\"var(--danger)\">BOUNCED<\u002Ftext>\r\n                <rect x=\"152\" y=\"176\" width=\"100\" height=\"28\" rx=\"6\" fill=\"var(--danger-soft)\" stroke=\"var(--danger)\"><\u002Frect><text x=\"202\" y=\"195\" text-anchor=\"middle\" fill=\"var(--danger)\">DROPPED<\u002Ftext>\r\n              <\u002Fg>\r\n              <line x1=\"252\" y1=\"20\" x2=\"330\" y2=\"112\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"54\" x2=\"330\" y2=\"113\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"88\" x2=\"330\" y2=\"114\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"122\" x2=\"330\" y2=\"115\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"156\" x2=\"330\" y2=\"116\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <line x1=\"252\" y1=\"190\" x2=\"330\" y2=\"117\" stroke=\"currentColor\" stroke-dasharray=\"3 3\"><\u002Fline>\r\n              <rect x=\"332\" y=\"92\" width=\"150\" height=\"44\" rx=\"7\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"407\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">TRACKING API<\u002Ftext><text x=\"407\" y=\"126\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">\u002F webhook<\u002Ftext>\r\n              <line x1=\"482\" y1=\"114\" x2=\"522\" y2=\"114\" stroke=\"currentColor\" marker-end=\"url(#armap5)\"><\u002Fline>\r\n              <rect x=\"524\" y=\"92\" width=\"120\" height=\"44\" rx=\"7\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"584\" y=\"118\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">SQL DATABASE<\u002Ftext>\r\n              <line x1=\"644\" y1=\"114\" x2=\"684\" y2=\"114\" stroke=\"currentColor\" marker-end=\"url(#armap5)\"><\u002Fline>\r\n              <rect x=\"686\" y=\"70\" width=\"0\" height=\"0\"><\u002Frect>\r\n              <path d=\"M644,105 C670,80 690,60 700,50\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#armap5)\"><\u002Fpath>\r\n              <text x=\"612\" y=\"70\" font-size=\"9.5\" fill=\"currentColor\">ISN Tracking<\u002Ftext>\r\n              <path d=\"M644,123 C670,150 690,170 700,180\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#armap5)\"><\u002Fpath>\r\n              <text x=\"600\" y=\"185\" font-size=\"9.5\" fill=\"currentColor\">Automation Engine<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>SendGrid event webhooks (sent, delivered, opened, clicked, bounced, dropped) write into the same SQL database the automation engine reads from, so the next scheduled step always sees the shopper's latest state.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Tracking link flow<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box\">EMAIL<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">UNIQUE TRACKING LINK<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">SHOPPERMATCH TRACKING ENDPOINT<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">ASSIGNMENT PAGE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box success\">ACCEPT<\u002Fdiv><div class=\"flow-box danger\">DECLINE<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; max-width:520px;\">\r\n            <div class=\"card\" style=\"padding:14px 16px;\"><div class=\"muted\" style=\"font-size:11px; text-transform:uppercase; letter-spacing:.06em;\">Shopper A<\u002Fdiv><div style=\"font-size:12.5px; margin-top:6px;\">Invitation A → Token A → Tracking Link A<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"card\" style=\"padding:14px 16px;\"><div class=\"muted\" style=\"font-size:11px; text-transform:uppercase; letter-spacing:.06em;\">Shopper B<\u002Fdiv><div style=\"font-size:12.5px; margin-top:6px;\">Invitation B → Token B → Tracking Link B<\u002Fdiv><\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:10px;\">Every invitation gets its own token; the token identifies the shopper, the campaign and the invitation — never shared across shoppers.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Decision engine<\u002Fh3>\r\n          <div class=\"flow-row vertical\">\r\n            <div class=\"flow-box\">INITIAL INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">WAIT 2–3 DAYS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box ai\">CHECK SHOPPER ACTIVITY<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"card\" style=\"margin-top:14px; padding:6px 20px;\">\r\n            <table>\r\n              <thead><tr><th>Shopper signal<\u002Fth><th>Automation result<\u002Fth><\u002Ftr><\u002Fthead>\r\n              <tbody>\r\n                <tr><td>Accepted<\u002Ftd><td><span class=\"pill pill-active\">Stop automation<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Declined<\u002Ftd><td><span class=\"pill pill-failed\">Stop automation<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Visited \u002F Clicked<\u002Ftd><td><span class=\"pill pill-completed\">Stop or mark active — per config<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>Opened, no action<\u002Ftd><td><span class=\"pill pill-pending\">Continue \u002F reminder<\u002Fspan><\u002Ftd><\u002Ftr>\r\n                <tr><td>No activity<\u002Ftd><td><span class=\"pill pill-pending\">Send reminder<\u002Fspan><\u002Ftd><\u002Ftr>\r\n              <\u002Ftbody>\r\n            <\u002Ftable>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Reminder workflow &amp; stop conditions<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n              <div class=\"flow-box\">INITIAL INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">WAIT 2–3 DAYS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">CHECK TRACKING<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box warning\">NO RESPONSE?<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">REMINDER EMAIL<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">WAIT 2–3 DAYS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">CHECK TRACKING<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box warning\">NO RESPONSE?<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box\">FINAL REMINDER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box success\">AUTOMATION COMPLETE<\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\" style=\"font-size:14px;\">Stop conditions<\u002Fh3>\r\n              <p class=\"muted\" style=\"font-size:12.5px; margin-top:6px;\">If the shopper completes or meaningfully engages with the assignment, automation stops for that shopper — no further reminder is sent.<\u002Fp>\r\n              <ul class=\"checklist\" style=\"margin-top:14px;\">\r\n                <li>Accepted → stop<\u002Fli>\r\n                <li>Declined → stop<\u002Fli>\r\n                <li>Visited → stop \u002F complete<\u002Fli>\r\n                <li>Clicked → stop \u002F complete<\u002Fli>\r\n                <li>Or another configured completion condition<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Upcoming vs. active campaign flow<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Upcoming campaign<\u002Fdiv>\r\n              <div class=\"flow-row vertical\" style=\"align-items:flex-start; margin-top:12px;\">\r\n                <div class=\"flow-box sm\">UPCOMING CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SELECT SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SELECT EMAIL TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">CONFIGURE AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm warning\">SCHEDULE START TIME<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">CAMPAIGN BECOMES ACTIVE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">AUTOMATION STARTS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm success\">INITIAL INVITATION<\u002Fdiv>\r\n              <\u002Fdiv>\r\n              <p class=\"muted\" style=\"font-size:12px; margin-top:12px;\">Upcoming campaigns never send email before their configured start time.<\u002Fp>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Active campaign<\u002Fdiv>\r\n              <div class=\"flow-row vertical\" style=\"align-items:flex-start; margin-top:12px;\">\r\n                <div class=\"flow-box sm\">ACTIVE CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm ai\">AI RECOMMENDATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SELECT SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">EMAIL TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">START AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm accent\">SEND INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">TRACK<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">REMINDER \u002F STOP<\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Backend &amp; database connection<\u002Fh3>\r\n          <figure style=\"margin-top:14px;\">\r\n            <svg viewBox=\"0 0 780 400\" role=\"img\" aria-label=\"ShopperMatch backend branches into SQL database, automation engine and SendGrid, which write shopper state, next action and email events; all three converge into the tracking system, which feeds the ISN admin portal.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n              <defs><marker id=\"armap4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n              <rect x=\"260\" y=\"16\" width=\"260\" height=\"50\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"390\" y=\"46\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--accent)\">SHOPPERMATCH BACKEND<\u002Ftext>\r\n\r\n              <line x1=\"390\" y1=\"66\" x2=\"130\" y2=\"120\" stroke=\"currentColor\" marker-end=\"url(#armap4)\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"66\" x2=\"390\" y2=\"120\" stroke=\"currentColor\" marker-end=\"url(#armap4)\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"66\" x2=\"650\" y2=\"120\" stroke=\"currentColor\" marker-end=\"url(#armap4)\"><\u002Fline>\r\n\r\n              <rect x=\"45\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"130\" y=\"150\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--text)\">SQL DATABASE<\u002Ftext>\r\n              <rect x=\"305\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect>\r\n              <text x=\"390\" y=\"150\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ai-ink)\">AUTOMATION ENGINE<\u002Ftext>\r\n              <rect x=\"565\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"650\" y=\"150\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--accent)\">SENDGRID<\u002Ftext>\r\n\r\n              <line x1=\"130\" y1=\"170\" x2=\"130\" y2=\"196\" stroke=\"currentColor\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"170\" x2=\"390\" y2=\"196\" stroke=\"currentColor\"><\u002Fline>\r\n              <line x1=\"650\" y1=\"170\" x2=\"650\" y2=\"196\" stroke=\"currentColor\"><\u002Fline>\r\n              <text x=\"130\" y=\"210\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"var(--font-mono)\" fill=\"currentColor\">Shopper State<\u002Ftext>\r\n              <text x=\"390\" y=\"210\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"var(--font-mono)\" fill=\"currentColor\">Next Action<\u002Ftext>\r\n              <text x=\"650\" y=\"210\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"var(--font-mono)\" fill=\"currentColor\">Email Events<\u002Ftext>\r\n\r\n              <path d=\"M130,222 C130,250 350,250 380,250\" fill=\"none\" stroke=\"currentColor\"><\u002Fpath>\r\n              <path d=\"M650,222 C650,250 430,250 400,250\" fill=\"none\" stroke=\"currentColor\"><\u002Fpath>\r\n              <line x1=\"390\" y1=\"222\" x2=\"390\" y2=\"250\" stroke=\"currentColor\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"250\" x2=\"390\" y2=\"266\" stroke=\"currentColor\" marker-end=\"url(#armap4)\"><\u002Fline>\r\n\r\n              <rect x=\"290\" y=\"268\" width=\"200\" height=\"46\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"390\" y=\"296\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--accent)\">TRACKING SYSTEM<\u002Ftext>\r\n\r\n              <line x1=\"390\" y1=\"314\" x2=\"390\" y2=\"340\" stroke=\"currentColor\" marker-end=\"url(#armap4)\"><\u002Fline>\r\n              <rect x=\"280\" y=\"342\" width=\"220\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"390\" y=\"370\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--text)\">ISN ADMIN PORTAL<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>Every automation state is persisted in the SQL database. The automation engine and SendGrid both write into it, and the tracking system — which feeds the ISN admin portal — reads only from that shared store.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Background scheduler<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:6px; max-width:70ch;\">The automation engine runs as a backend process — the browser or client portal does not need to stay open for reminders to go out.<\u002Fp>\r\n          <div class=\"flow-row vertical\" style=\"margin-top:14px;\">\r\n            <div class=\"flow-box ai\">SCHEDULER \u002F WORKER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">FIND DUE AUTOMATIONS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">CHECK SHOPPER STATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">EXECUTE NEXT STEP<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SEND EMAIL \u002F STOP<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">UPDATE DATABASE<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Safeguards<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px;\">\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\" style=\"font-size:14px;\">Maximum email policy<\u002Fh3>\r\n              <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n                <li>1. Initial invitation<\u002Fli>\r\n                <li>2. Reminder<\u002Fli>\r\n                <li>3. Final reminder<\u002Fli>\r\n              <\u002Ful>\r\n              <div class=\"stack-note\" style=\"margin-top:12px;\"><b>Automation complete →<\u002Fb> no further emails. Enforced per shopper, not per campaign.<\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <h3 class=\"h3\" style=\"font-size:14px;\">Idempotency<\u002Fh3>\r\n              <p class=\"muted\" style=\"font-size:12.5px; margin-top:8px;\">Each automation step is idempotent — a shopper cannot receive the same step twice, even under retries or overlapping scheduler runs.<\u002Fp>\r\n              <div style=\"display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;\">\r\n                <span class=\"chip\">automation_id<\u002Fspan><span class=\"chip\">shopper_id<\u002Fspan><span class=\"chip\">step_number<\u002Fspan>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">ISN admin tracking &amp; audit logs<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">ISN admin sees<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px; columns:2;\">\r\n                <li>Email provider status<\u002Fli>\r\n                <li>SendGrid events<\u002Fli>\r\n                <li>Delivery failures<\u002Fli>\r\n                <li>Bounce \u002F drop events<\u002Fli>\r\n                <li>Webhook events<\u002Fli>\r\n                <li>Automation errors<\u002Fli>\r\n                <li>Failed email attempts<\u002Fli>\r\n                <li>Retry status<\u002Fli>\r\n                <li>Tracking events<\u002Fli>\r\n                <li>Audit logs<\u002Fli>\r\n                <li>Automation state<\u002Fli>\r\n                <li>Database events<\u002Fli>\r\n              <\u002Ful>\r\n              <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">This depth of visibility lets ISN diagnose issues when a third-party client reports a problem.<\u002Fp>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Audit log events<\u002Fdiv>\r\n              <div style=\"display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;\">\r\n                <span class=\"chip\">Automation Created<\u002Fspan>\r\n                <span class=\"chip\">Automation Started<\u002Fspan>\r\n                <span class=\"chip\">Automation Paused<\u002Fspan>\r\n                <span class=\"chip\">Automation Resumed<\u002Fspan>\r\n                <span class=\"chip\">Automation Stopped<\u002Fspan>\r\n                <span class=\"chip\">Email Sent<\u002Fspan>\r\n                <span class=\"chip\">Email Delivered<\u002Fspan>\r\n                <span class=\"chip\">Email Opened<\u002Fspan>\r\n                <span class=\"chip\">Email Clicked<\u002Fspan>\r\n                <span class=\"chip\">Assignment Visited<\u002Fspan>\r\n                <span class=\"chip\">Assignment Accepted<\u002Fspan>\r\n                <span class=\"chip\">Assignment Declined<\u002Fspan>\r\n                <span class=\"chip\">Reminder Scheduled<\u002Fspan>\r\n                <span class=\"chip\">Reminder Sent<\u002Fspan>\r\n                <span class=\"chip\">Final Reminder Sent<\u002Fspan>\r\n                <span class=\"chip\">Email Bounced<\u002Fspan>\r\n                <span class=\"chip\">Email Failed<\u002Fspan>\r\n              <\u002Fdiv>\r\n              <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n                <div class=\"flow-box sm\">AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-box sm\">EVENT<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-box sm accent\">AUDIT LOG<\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"flow-row\" style=\"margin-top:16px;\">\r\n            <div class=\"flow-box accent\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">EVENT WEBHOOK<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">TRACKING DATABASE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">ISN ADMIN TRACKING<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:8px;\">Admin tracking surfaces: sent, delivered, opened, clicked, visited, accepted, declined, bounced, dropped, reminder sent, final reminder sent — all read from the same backend the client portal reads from.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Client portal visibility<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:6px; max-width:70ch;\">The client sees business-level automation status — never technical infrastructure detail.<\u002Fp>\r\n          <div class=\"card\" style=\"margin-top:14px; padding:6px 20px;\">\r\n            <table>\r\n              <thead><tr><th>Shopper<\u002Fth><th>Step<\u002Fth><th>Response<\u002Fth><th>Next action<\u002Fth><\u002Ftr><\u002Fthead>\r\n              <tbody>\r\n                <tr><td>Sarah Johnson<\u002Ftd><td>Initial Invitation<\u002Ftd><td><span class=\"pill pill-pending\">Opened<\u002Fspan><\u002Ftd><td>Reminder in 1 day<\u002Ftd><\u002Ftr>\r\n                <tr><td>Rakesh Patel<\u002Ftd><td>Initial Invitation<\u002Ftd><td><span class=\"pill pill-active\">Accepted<\u002Fspan><\u002Ftd><td>Automation stopped<\u002Ftd><\u002Ftr>\r\n                <tr><td>Karan Shah<\u002Ftd><td>Reminder<\u002Ftd><td><span class=\"pill pill-pending\">No response<\u002Fspan><\u002Ftd><td>Final reminder<\u002Ftd><\u002Ftr>\r\n              <\u002Ftbody>\r\n            <\u002Ftable>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:32px;\">How it fits together<\u002Fh3>\r\n          <p class=\"lede\" style=\"max-width:76ch;\">ShopperMatch.AI runs email outreach as a backend-driven, shopper-level automation workflow. The client selects shoppers through the campaign and AI recommendation flow, while the automation engine renders personalized email templates and dispatches invitations through SendGrid. Every invitation receives a unique tracking identity, allowing delivery, open, click, visit and assignment responses to be written back into the shared SQL database. The automation engine evaluates each shopper independently after the configured waiting period and either stops the sequence when the shopper engages or sends the next reminder. ISN Tracking and Audit Logs read from the same event history, providing a single source of truth across the client and ISN admin portals.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:24px;\">Automation states remain shopper-specific<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13.5px; margin-top:6px; max-width:76ch;\">A campaign may contain many shoppers at different stages of the outreach funnel simultaneously. One shopper may have accepted an assignment while another is waiting for a reminder and another has not opened the invitation. Each shopper therefore maintains an independent automation state, next-action timestamp and communication history.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">End-to-end summary<\u002Fh3>\r\n          <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n            <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AI MATCH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOPPER<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">EMAIL<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">ASSIGNMENT<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">ACCEPT \u002F DECLINE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">CLIENT STATUS<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"flow-row\" style=\"margin-top:10px;\">\r\n            <div class=\"flow-box sm ai\">EMAIL EVENTS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">TRACKING DATABASE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">ISN TRACKING<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">AUDIT LOG<\u002Fdiv>\r\n          <\u002Fdiv>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n      <!-- 06 OUTREACH WORKFLOW -->\r\n      <section class=\"panel\" id=\"panel-05\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 05 · Outreach Workflow<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">Outreach Workflow<\u002Fdiv>\r\n          <h2 class=\"h2\">From AI-matched shoppers to tracked invitations<\u002Fh2>\r\n          <p class=\"lede\">One outreach flow connecting campaign requirements, shopper selection, personalized communication and response tracking.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Purpose of Outreach<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13px; margin-top:6px; max-width:74ch;\">Outreach is the operational layer between campaign requirements and shopper communication. It initiates communication and creates the invitation\u002Ftracking relationship — it does not own the tracking system or the automation engine, both of which are shared backend services that Outreach connects to.<\u002Fp>\r\n          <div class=\"card\" style=\"margin-top:14px;\">\r\n            <ul class=\"checklist\" style=\"columns:2;\">\r\n              <li>Select a campaign<\u002Fli>\r\n              <li>Select a shop<\u002Fli>\r\n              <li>View AI-recommended shoppers<\u002Fli>\r\n              <li>Select one or multiple shoppers<\u002Fli>\r\n              <li>Choose \u002F create an email template<\u002Fli>\r\n              <li>Review personalized email<\u002Fli>\r\n              <li>Generate unique assignment \u002F tracking links<\u002Fli>\r\n              <li>Start outreach<\u002Fli>\r\n              <li>Send invitations through SendGrid<\u002Fli>\r\n              <li>Track shopper activity<\u002Fli>\r\n              <li>Hand off activity to Email Automation<\u002Fli>\r\n              <li>View resulting status<\u002Fli>\r\n            <\u002Ful>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Outreach architecture<\u002Fh3>\r\n          <figure style=\"margin-top:14px;\">\r\n            <svg viewBox=\"0 0 1170 172\" role=\"img\" aria-label=\"Campaign to Shop to AI Recommendation to Select Shoppers to Outreach to Email Template, then Personalize to Generate Invitation to Unique Tracking Link to Email Automation to SendGrid to Shopper to Tracking to Accept or Decline.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n  <defs><marker id=\"arow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n<rect x=\"12\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"87\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">CAMPAIGN<\u002Ftext>\r\n<rect x=\"178\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"253\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">SHOP<\u002Ftext>\r\n<rect x=\"344\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect><text x=\"419\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ai-ink)\">AI<\u002Ftext><text x=\"419\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ai-ink)\">RECOMMENDATION<\u002Ftext>\r\n<rect x=\"510\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"585\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">SELECT<\u002Ftext><text x=\"585\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">SHOPPERS<\u002Ftext>\r\n<rect x=\"676\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"751\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--accent)\">OUTREACH<\u002Ftext>\r\n<rect x=\"842\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"917\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--te
