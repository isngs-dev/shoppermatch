xt)\">EMAIL<\u002Ftext><text x=\"917\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">TEMPLATE<\u002Ftext>\r\n<rect x=\"1008\" y=\"20\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"1083\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">PERSONALIZE<\u002Ftext>\r\n<rect x=\"12\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"87\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">GENERATE<\u002Ftext><text x=\"87\" y=\"146\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">INVITATION<\u002Ftext>\r\n<rect x=\"178\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"253\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">UNIQUE TRACKING<\u002Ftext><text x=\"253\" y=\"146\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">LINK<\u002Ftext>\r\n<rect x=\"344\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect><text x=\"419\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ai-ink)\">EMAIL<\u002Ftext><text x=\"419\" y=\"146\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--ai-ink)\">AUTOMATION<\u002Ftext>\r\n<rect x=\"510\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"585\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--accent)\">SENDGRID<\u002Ftext>\r\n<rect x=\"676\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect><text x=\"751\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">SHOPPER<\u002Ftext>\r\n<rect x=\"842\" y=\"110\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect><text x=\"917\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--accent)\">TRACKING<\u002Ftext>\r\n<rect x=\"1008\" y=\"110\" width=\"71\" height=\"46\" rx=\"8\" fill=\"var(--success-soft)\" stroke=\"var(--success)\"><\u002Frect><text x=\"1043.5\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--success)\">ACCEPT<\u002Ftext>\r\n<rect x=\"1087\" y=\"110\" width=\"71\" height=\"46\" rx=\"8\" fill=\"var(--danger-soft)\" stroke=\"var(--danger)\"><\u002Frect><text x=\"1122.5\" y=\"137\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--danger)\">DECLINE<\u002Ftext>\r\n<line x1=\"162\" y1=\"43\" x2=\"178\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"328\" y1=\"43\" x2=\"344\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"494\" y1=\"43\" x2=\"510\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"660\" y1=\"43\" x2=\"676\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"826\" y1=\"43\" x2=\"842\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"992\" y1=\"43\" x2=\"1008\" y2=\"43\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<path d=\"M1083,66 C1083,91 87,85 87,110\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fpath>\r\n<line x1=\"162\" y1=\"133\" x2=\"178\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"328\" y1=\"133\" x2=\"344\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"494\" y1=\"133\" x2=\"510\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"660\" y1=\"133\" x2=\"676\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"826\" y1=\"133\" x2=\"842\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<line x1=\"992\" y1=\"133\" x2=\"1008\" y2=\"133\" stroke=\"currentColor\" marker-end=\"url(#arow)\"><\u002Fline>\r\n<\u002Fsvg>\r\n            <figcaption>Outreach sits between campaign\u002Fshop selection and the shared communication services: it hands selected shoppers to the email template and automation engine, which dispatch through SendGrid and write every response back into shared tracking.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Campaign input &amp; shop selection<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Campaign provides<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n                <li>Campaign Name<\u002Fli>\r\n                <li>Campaign Type<\u002Fli>\r\n                <li>Campaign Status<\u002Fli>\r\n                <li>Start Date<\u002Fli>\r\n                <li>Deadline<\u002Fli>\r\n                <li>Required Shoppers<\u002Fli>\r\n                <li>Shop Requirements<\u002Fli>\r\n                <li>Location<\u002Fli>\r\n                <li>Compensation<\u002Fli>\r\n                <li>Eligibility Requirements<\u002Fli>\r\n              <\u002Ful>\r\n              <div class=\"flow-row vertical\" style=\"margin-top:14px; align-items:flex-start;\">\r\n                <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">CAMPAIGN REQUIREMENTS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SHOP \u002F ASSIGNMENT REQUIREMENTS<\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Shop provides<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px; columns:2;\">\r\n                <li>Shop Name<\u002Fli>\r\n                <li>Brand<\u002Fli>\r\n                <li>Location<\u002Fli>\r\n                <li>City<\u002Fli>\r\n                <li>Address<\u002Fli>\r\n                <li>Assignment Type<\u002Fli>\r\n                <li>Campaign<\u002Fli>\r\n                <li>Deadline<\u002Fli>\r\n                <li>Compensation<\u002Fli>\r\n                <li>Status<\u002Fli>\r\n              <\u002Ful>\r\n              <div class=\"flow-row vertical\" style=\"margin-top:14px; align-items:flex-start;\">\r\n                <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">AVAILABLE SHOPS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SELECT SHOP<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SHOP REQUIREMENTS<\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">AI recommendation handoff<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box sm\">SHOP REQUIREMENTS<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOPPER DATABASE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">AI RECOMMENDATION ENGINE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">RANKED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">OUTREACH<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:10px; max-width:70ch;\">Ranking is based on the existing shopper attributes already in the database — location, experience, availability, relevant profile, past activity\u002Fperformance, campaign eligibility. Outreach reuses the existing AI Recommendation module; it does not run its own matching logic.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Recommended shopper list<\u002Fh3>\r\n          <div class=\"card\" style=\"margin-top:14px; padding:6px 20px;\">\r\n            <table>\r\n              <thead><tr><th>Shopper<\u002Fth><th>Location<\u002Fth><th>Experience<\u002Fth><th>Availability<\u002Fth><th>Match<\u002Fth><th>Reason<\u002Fth><\u002Ftr><\u002Fthead>\r\n              <tbody>\r\n                <tr><td>Sarah Johnson<\u002Ftd><td>Mumbai<\u002Ftd><td>3 years<\u002Ftd><td><span class=\"pill pill-active\">Available<\u002Fspan><\u002Ftd><td class=\"tabular\">94%<\u002Ftd><td style=\"font-size:11.5px;\">Strong location match + relevant retail audit experience<\u002Ftd><\u002Ftr>\r\n              <\u002Ftbody>\r\n            <\u002Ftable>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:8px;\">Every match score ships with a reason — an unexplained AI score is never shown on its own.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Multi-shopper selection<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box ai\">AI RECOMMENDATIONS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">SELECT SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SELECTED SHOPPER POOL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"grid grid-3\" style=\"margin-top:14px; max-width:640px;\">\r\n            <div class=\"metric\"><div class=\"num\">5<\u002Fdiv><div class=\"lbl\">Campaign requires<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"metric\"><div class=\"num\">10<\u002Fdiv><div class=\"lbl\">AI recommends<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"metric\"><div class=\"num\">5 \u002F 5<\u002Fdiv><div class=\"lbl\">Client selects<\u002Fdiv><\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">The system blocks selection beyond the required count unless the product explicitly enables over-selection \u002F waitlisting.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Outreach compose<\u002Fh3>\r\n          <div class=\"flow-row vertical\">\r\n            <div class=\"flow-box\">SELECTED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box accent\">EMAIL TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">COMPOSE EMAIL<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">PREVIEW<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box success\">CONFIRM OUTREACH<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div style=\"display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;\">\r\n            <span class=\"chip\">{{shopper_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{campaign_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{shop_name}}<\u002Fspan>\r\n            <span class=\"chip\">{{location}}<\u002Fspan>\r\n            <span class=\"chip\">{{compensation}}<\u002Fspan>\r\n            <span class=\"chip\">{{deadline}}<\u002Fspan>\r\n            <span class=\"chip\">{{assignment_link}}<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">The email supports recipient, subject, HTML body, plain text, dynamic variables and the assignment link.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:24px;\">Email template connection<\u002Fh3>\r\n          <div class=\"flow-row vertical\">\r\n            <div class=\"flow-box accent\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">EMAIL TEMPLATE SERVICE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">SELECT TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">RENDER TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box success\">PERSONALIZED EMAIL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"stack-note\" style=\"margin-top:12px;\"><b>Shared, not separate —<\u002Fb> Outreach consumes the same Email Template service (Initial Invitation, Reminder, Final Reminder) used by Email Automation. Follow-up rules belong to Email Automation; Outreach only starts the communication.<\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:24px;\">Personalization<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box sm\">Shopper Data<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Campaign Data<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Shop Data<\u002Fdiv><div class=\"flow-arrow\">+<\u002Fdiv>\r\n            <div class=\"flow-box sm\">Assignment Data<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box success\">PERSONALIZED EMAIL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"card\" style=\"margin-top:14px; max-width:440px; font-size:12.5px; line-height:1.7;\">\r\n            Hi Sarah,<br>We have a new mystery shopping opportunity for you.<br><br>\r\n            <b>Campaign:<\u002Fb> Nike Mumbai Store Audit<br>\r\n            <b>Shop:<\u002Fb> Nike Mumbai Store<br>\r\n            <b>Location:<\u002Fb> Mumbai<br>\r\n            <b>Compensation:<\u002Fb> ₹500<br>\r\n            <b>Deadline:<\u002Fb> 25 August 2026<br><br>\r\n            <span class=\"chip\">View Assignment → [unique assignment link]<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:8px;\">Each shopper receives their own personalized email — never a shared or generic copy.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Invitation generation &amp; tracking link<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n                <div class=\"flow-box sm\">SELECTED SHOPPER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">CREATE INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm ai\">GENERATE TRACKING TOKEN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">GENERATE ASSIGNMENT LINK<\u002Fdiv>\r\n              <\u002Fdiv>\r\n              <div style=\"display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;\">\r\n                <span class=\"chip\">invitation_id<\u002Fspan>\r\n                <span class=\"chip\">shopper_id<\u002Fspan>\r\n                <span class=\"chip\">campaign_id<\u002Fspan>\r\n                <span class=\"chip\">shop_id<\u002Fspan>\r\n                <span class=\"chip\">template_id<\u002Fspan>\r\n                <span class=\"chip\">tracking_token<\u002Fspan>\r\n                <span class=\"chip\">assignment_link<\u002Fspan>\r\n                <span class=\"chip\">status<\u002Fspan>\r\n                <span class=\"chip\">created_at<\u002Fspan>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n                <div class=\"flow-box sm\">EMAIL<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm ai\">TRACKING ENDPOINT<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm accent\">SHOPPERMATCH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">ASSIGNMENT PAGE<\u002Fdiv>\r\n              <\u002Fdiv>\r\n              <ol class=\"checklist\" style=\"margin-top:14px; list-style:decimal; padding-left:18px;\">\r\n                <li style=\"display:list-item;\">Validate token<\u002Fli>\r\n                <li style=\"display:list-item;\">Identify invitation<\u002Fli>\r\n                <li style=\"display:list-item;\">Record CLICKED<\u002Fli>\r\n                <li style=\"display:list-item;\">Record VISITED when assignment page loads<\u002Fli>\r\n                <li style=\"display:list-item;\">Redirect \u002F render assignment<\u002Fli>\r\n              <\u002Fol>\r\n              <p class=\"muted\" style=\"font-size:11.5px; margin-top:8px;\">Internal database IDs are never exposed in the link — only the opaque tracking token.<\u002Fp>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">SendGrid handoff<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box accent\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">EMAIL SERVICE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">EMAIL AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box\">REAL EMAIL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"stack-note\" style=\"margin-top:12px;\"><b>Not a mock —<\u002Fb> Outreach passes the rendered email and recipient to the existing email service and SendGrid integration; SendGrid's response\u002Fstatus is written back to the shared backend.<\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Outreach vs. Email Automation vs. Tracking<\u002Fh3>\r\n          <div class=\"grid grid-3\" style=\"margin-top:14px;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Outreach<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n                <li>Campaign-level communication initiation<\u002Fli>\r\n                <li>Shopper selection<\u002Fli>\r\n                <li>Template selection<\u002Fli>\r\n                <li>Email composition<\u002Fli>\r\n                <li>Invitation creation<\u002Fli>\r\n                <li>Assignment link generation<\u002Fli>\r\n                <li>Starting communication<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\" style=\"color:var(--ai-ink);\">Email Automation<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n                <li>Initial email<\u002Fli>\r\n                <li>Waiting period<\u002Fli>\r\n                <li>Checking shopper activity<\u002Fli>\r\n                <li>Reminder<\u002Fli>\r\n                <li>Final reminder<\u002Fli>\r\n                <li>Stop conditions<\u002Fli>\r\n                <li>Retries<\u002Fli>\r\n                <li>Scheduling<\u002Fli>\r\n                <li>Shopper-level automation state<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\" style=\"color:var(--accent);\">Tracking<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n                <li>Sent<\u002Fli>\r\n                <li>Delivered<\u002Fli>\r\n                <li>Opened<\u002Fli>\r\n                <li>Clicked<\u002Fli>\r\n                <li>Visited<\u002Fli>\r\n                <li>Accepted<\u002Fli>\r\n                <li>Declined<\u002Fli>\r\n                <li>Bounced<\u002Fli>\r\n                <li>Dropped<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Outreach → Automation handoff<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n              <div class=\"flow-box accent\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm\">CREATE INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm ai\">START AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm\">INITIAL EMAIL<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm\">WAIT<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm warning\">CHECK TRACKING<\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Shopper activity?<\u002Fdiv>\r\n              <div class=\"grid grid-2\" style=\"margin-top:12px; gap:10px;\">\r\n                <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n                  <div class=\"flow-box sm success\">YES<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm success\">STOP<\u002Fdiv>\r\n                <\u002Fdiv>\r\n                <div class=\"flow-row vertical\" style=\"align-items:flex-start;\">\r\n                  <div class=\"flow-box sm warning\">NO<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm\">REMINDER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm\">WAIT<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm\">CHECK AGAIN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm\">FINAL REMINDER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                  <div class=\"flow-box sm\">END<\u002Fdiv>\r\n                <\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">Each shopper carries an independent automation state — this branch runs separately for every invitation created by Outreach.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Bulk outreach<\u002Fh3>\r\n          <div class=\"card\" style=\"margin-top:14px;\">\r\n            <div class=\"grid grid-3\" style=\"max-width:520px;\">\r\n              <div class=\"metric\"><div class=\"num\">5<\u002Fdiv><div class=\"lbl\">Required shoppers<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"metric\"><div class=\"num\">5<\u002Fdiv><div class=\"lbl\">Selected shoppers<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"metric\"><div class=\"num\">5<\u002Fdiv><div class=\"lbl\">Invitations generated<\u002Fdiv><\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"flow-row vertical\" style=\"margin-top:16px; align-items:flex-start;\">\r\n              <div class=\"flow-box sm\">Generate 5 invitations<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm\">Generate 5 unique tracking links<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm\">Render 5 personalized emails<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm ai\">Create 5 automation states<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n              <div class=\"flow-box sm accent\">Send through SendGrid<\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">Nike Mumbai Store Audit — each of the 5 shoppers is processed independently, start to finish.<\u002Fp>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Shopper-level state<\u002Fh3>\r\n          <div class=\"card\" style=\"margin-top:14px; padding:6px 20px;\">\r\n            <table>\r\n              <thead><tr><th>Shopper<\u002Fth><th>Status<\u002Fth><th>Next action<\u002Fth><\u002Ftr><\u002Fthead>\r\n              <tbody>\r\n                <tr><td>Sarah<\u002Ftd><td><span class=\"pill pill-active\">Accepted<\u002Fspan><\u002Ftd><td>Stop<\u002Ftd><\u002Ftr>\r\n                <tr><td>Rakesh<\u002Ftd><td><span class=\"pill pill-pending\">Opened<\u002Fspan><\u002Ftd><td>Reminder<\u002Ftd><\u002Ftr>\r\n                <tr><td>Karan<\u002Ftd><td><span class=\"pill pill-completed\">Clicked<\u002Fspan><\u002Ftd><td>Stop<\u002Ftd><\u002Ftr>\r\n                <tr><td>Rahul<\u002Ftd><td><span class=\"pill pill-pending\">No response<\u002Fspan><\u002Ftd><td>Reminder<\u002Ftd><\u002Ftr>\r\n                <tr><td>Amit<\u002Ftd><td><span class=\"pill pill-failed\">Bounced<\u002Fspan><\u002Ftd><td>Stop<\u002Ftd><\u002Ftr>\r\n              <\u002Ftbody>\r\n            <\u002Ftable>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:10px; max-width:74ch;\">Outreach creates individual invitation and automation records for every shopper. Campaign-level outreach therefore becomes a collection of independently tracked shopper communication states.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Outreach status<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Campaign \u002F outreach level<\u002Fdiv>\r\n              <div style=\"display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;\">\r\n                <span class=\"chip\">DRAFT<\u002Fspan>\r\n                <span class=\"chip\">READY<\u002Fspan>\r\n                <span class=\"chip\">SCHEDULED<\u002Fspan>\r\n                <span class=\"chip\">PROCESSING<\u002Fspan>\r\n                <span class=\"chip\">SENT<\u002Fspan>\r\n                <span class=\"chip\">PARTIALLY SENT<\u002Fspan>\r\n                <span class=\"chip\">COMPLETED<\u002Fspan>\r\n                <span class=\"chip\">FAILED<\u002Fspan>\r\n                <span class=\"chip\">CANCELLED<\u002Fspan>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Shopper \u002F email-event level<\u002Fdiv>\r\n              <div style=\"display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;\">\r\n                <span class=\"chip\">PENDING<\u002Fspan>\r\n                <span class=\"chip\">SENT<\u002Fspan>\r\n                <span class=\"chip\">DELIVERED<\u002Fspan>\r\n                <span class=\"chip\">OPENED<\u002Fspan>\r\n                <span class=\"chip\">CLICKED<\u002Fspan>\r\n                <span class=\"chip\">VISITED<\u002Fspan>\r\n                <span class=\"chip\">ACCEPTED<\u002Fspan>\r\n                <span class=\"chip\">DECLINED<\u002Fspan>\r\n                <span class=\"chip\">BOUNCED<\u002Fspan>\r\n                <span class=\"chip\">FAILED<\u002Fspan>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">Campaign\u002Foutreach status and shopper-level email-event status are tracked separately and never conflated.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Failure handling<\u002Fh3>\r\n          <div class=\"card\" style=\"margin-top:14px;\">\r\n            <div class=\"grid grid-3\" style=\"max-width:560px;\">\r\n              <div class=\"metric\"><div class=\"num\">8<\u002Fdiv><div class=\"lbl\">Sent<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"metric\"><div class=\"num\">1<\u002Fdiv><div class=\"lbl\">Bounced<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"metric\"><div class=\"num\">1<\u002Fdiv><div class=\"lbl\">Failed<\u002Fdiv><\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div style=\"margin-top:14px;\"><span class=\"pill pill-pending\">Campaign status: Partially sent<\u002Fspan><\u002Fdiv>\r\n            <p class=\"muted\" style=\"font-size:12.5px; margin-top:10px;\">One bounced email or one failed SendGrid request never fails the entire campaign outreach — only that shopper's invitation is marked, so the client or ISN admin can retry just the failed communication.<\u002Fp>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Duplicate protection<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:6px; max-width:74ch;\">Outreach is idempotent. A page refresh, a double-clicked Send, a retried request or reopening the campaign must never create a duplicate invitation — enforced through a unique relationship between campaign, shopper and invitation. Every automation step remains independently idempotent.<\u002Fp>\r\n          <div style=\"display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;\">\r\n            <span class=\"chip\">campaign_id + shopper_id → unique invitation<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Client portal vs. ISN admin visibility<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Client sees<\u002Fdiv>\r\n              <div class=\"flow-row vertical\" style=\"margin-top:10px; align-items:flex-start;\">\r\n                <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SHOP<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">AI RECOMMENDED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SELECTED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">PREVIEW<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">SEND \u002F SCHEDULE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n                <div class=\"flow-box sm\">OUTREACH STATUS<\u002Fdiv>\r\n              <\u002Fdiv>\r\n              <p class=\"muted\" style=\"font-size:11.5px; margin-top:12px;\">Never shown: SendGrid API keys, webhook internals, database IDs, backend error detail, infrastructure configuration.<\u002Fp>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">ISN admin sees<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px; columns:2;\">\r\n                <li>Campaign<\u002Fli>\r\n                <li>Shop<\u002Fli>\r\n                <li>Shopper<\u002Fli>\r\n                <li>Invitation<\u002Fli>\r\n                <li>Email<\u002Fli>\r\n                <li>Template<\u002Fli>\r\n                <li>SendGrid status<\u002Fli>\r\n                <li>Delivery status<\u002Fli>\r\n                <li>Tracking events<\u002Fli>\r\n                <li>Automation state<\u002Fli>\r\n                <li>Failures<\u002Fli>\r\n                <li>Retries<\u002Fli>\r\n                <li>Audit logs<\u002Fli>\r\n              <\u002Ful>\r\n              <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n                <div class=\"flow-box sm\">CLIENT OUTREACH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n                <div class=\"flow-box sm accent\">SHARED BACKEND<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n                <div class=\"flow-box sm\">TRACKING DATABASE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n                <div class=\"flow-box sm ai\">ISN ADMIN TRACKING<\u002Fdiv>\r\n              <\u002Fdiv>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Audit log<\u002Fh3>\r\n          <div style=\"display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;\">\r\n            <span class=\"chip\">Outreach Created<\u002Fspan>\r\n            <span class=\"chip\">Shopper Selected<\u002Fspan>\r\n            <span class=\"chip\">Shopper Removed<\u002Fspan>\r\n            <span class=\"chip\">Template Selected<\u002Fspan>\r\n            <span class=\"chip\">Email Previewed<\u002Fspan>\r\n            <span class=\"chip\">Invitation Generated<\u002Fspan>\r\n            <span class=\"chip\">Outreach Started<\u002Fspan>\r\n            <span class=\"chip\">Email Sent<\u002Fspan>\r\n            <span class=\"chip\">Email Failed<\u002Fspan>\r\n            <span class=\"chip\">Automation Started<\u002Fspan>\r\n            <span class=\"chip\">Automation Paused<\u002Fspan>\r\n            <span class=\"chip\">Automation Resumed<\u002Fspan>\r\n            <span class=\"chip\">Automation Stopped<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">Every event above lands in the existing ISN Audit Logs — no separate Outreach audit trail.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Database &amp; backend architecture<\u002Fh3>\r\n          <div class=\"flow-row vertical\">\r\n            <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOP<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOPPER<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">RECOMMENDATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">INVITATION<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUTOMATION STATE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING EVENTS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUDIT LOG<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">All modules read and write through the existing SQL database and backend\u002Fdata layer — Outreach does not introduce a second database.<\u002Fp>\r\n          <figure style=\"margin-top:18px;\">\r\n            <svg viewBox=\"0 0 780 470\" role=\"img\" aria-label=\"Client Portal calls the Outreach API on the FastAPI backend, which branches into SQL database, AI engine and email service; email service calls SendGrid, which emits email events into the tracking API, back into the SQL database, and finally into ISN admin tracking.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n              <defs><marker id=\"arow6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n              <rect x=\"290\" y=\"10\" width=\"200\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"390\" y=\"37\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--text)\">CLIENT PORTAL<\u002Ftext>\r\n              <line x1=\"390\" y1=\"54\" x2=\"390\" y2=\"80\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <rect x=\"270\" y=\"82\" width=\"240\" height=\"44\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"390\" y=\"109\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--accent)\">OUTREACH API<\u002Ftext>\r\n              <line x1=\"390\" y1=\"126\" x2=\"390\" y2=\"152\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <rect x=\"260\" y=\"154\" width=\"260\" height=\"44\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"390\" y=\"181\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--accent)\">FASTAPI BACKEND<\u002Ftext>\r\n\r\n              <line x1=\"390\" y1=\"198\" x2=\"130\" y2=\"248\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"198\" x2=\"390\" y2=\"248\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <line x1=\"390\" y1=\"198\" x2=\"650\" y2=\"248\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n\r\n              <rect x=\"45\" y=\"248\" width=\"170\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"130\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">SQL DATABASE<\u002Ftext>\r\n              <rect x=\"305\" y=\"248\" width=\"170\" height=\"46\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect>\r\n              <text x=\"390\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ai-ink)\">AI ENGINE<\u002Ftext>\r\n              <rect x=\"565\" y=\"248\" width=\"170\" height=\"46\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"650\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">EMAIL SERVICE<\u002Ftext>\r\n\r\n              <line x1=\"650\" y1=\"294\" x2=\"650\" y2=\"320\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <rect x=\"565\" y=\"322\" width=\"170\" height=\"42\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"650\" y=\"348\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--accent)\">SENDGRID<\u002Ftext>\r\n\r\n              <line x1=\"650\" y1=\"364\" x2=\"650\" y2=\"390\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fline>\r\n              <text x=\"650\" y=\"405\" text-anchor=\"middle\" font-size=\"10\" font-family=\"var(--font-mono)\" fill=\"currentColor\">EMAIL EVENTS<\u002Ftext>\r\n              <path d=\"M650,412 C650,430 480,436 400,436\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#arow6)\"><\u002Fpath>\r\n              <text x=\"470\" y=\"430\" font-size=\"9.5\" fill=\"currentColor\">tracking API<\u002Ftext>\r\n\r\n              <path d=\"M130,294 C130,410 300,436 380,436\" fill=\"none\" stroke=\"currentColor\"><\u002Fpath>\r\n              <rect x=\"290\" y=\"416\" width=\"200\" height=\"42\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"390\" y=\"442\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--accent)\">SQL DATABASE<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>Client Portal calls the Outreach API on the same FastAPI backend used across ShopperMatch.AI. The backend branches into the SQL database, the AI engine, and the email service — which hands off to SendGrid — and every email event flows back through the tracking API into the same SQL database that feeds ISN admin tracking.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">End-to-end outreach workflow<\u002Fh3>\r\n          <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n            <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOP<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AI MATCH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SELECT SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">PERSONALIZE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">INVITATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING LINK<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUTOMATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOPPER<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">ACCEPT \u002F DECLINE<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"flow-row\" style=\"margin-top:10px;\">\r\n            <div class=\"flow-box sm ai\">OUTREACH EVENTS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">SHARED SQL DATABASE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">CLIENT STATUS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">ISN TRACKING<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">AUDIT LOG<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <h3 class=\"h3\" style=\"margin-top:32px;\">How it fits together<\u002Fh3>\r\n          <p class=\"lede\" style=\"max-width:76ch;\">Outreach is the operational bridge between campaign execution and shopper communication. Once a campaign and shop are selected, ShopperMatch.AI uses the existing AI recommendation engine to identify suitable shoppers. The client selects the required shoppers, chooses an email template and confirms the outreach. The backend creates an invitation and unique tracking identity for each shopper, renders the communication with campaign and shopper data, and hands the message to the existing email automation and SendGrid services. Every shopper then progresses independently through the communication and assignment funnel, while tracking events are written back to the shared database for client visibility, ISN Tracking and Audit Logs.<\u002Fp>\r\n          <h3 class=\"h3\" style=\"margin-top:24px;\">Outreach is the communication entry point<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13.5px; margin-top:6px; max-width:76ch;\">Outreach does not replace Campaigns, AI Recommendations, Email Automation or Tracking. It connects these services into one operational workflow. Campaigns define the requirement, AI identifies suitable shoppers, Outreach initiates communication, Email Automation controls follow-up behaviour, SendGrid delivers the message, and Tracking records the shopper response.<\u002Fp>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n      <!-- 07 PENDING FEATURES \u002F NEXT-PHASE MVP -->\r\n      <section class=\"panel\" id=\"panel-07\">\r\n        <div class=\"frame-label\"><span class=\"dot\"><\u002Fspan> 07 · Pending Features &amp; Next-Phase MVP Enhancements<\u002Fdiv>\r\n        <div class=\"board wide\">\r\n          <div class=\"eyebrow\">05 — Next Phase Product Workflow<\u002Fdiv>\r\n          <h2 class=\"h2\">Pending Features &amp; Next-Phase MVP Enhancements<\u002Fh2>\r\n          <p class=\"lede\">What's still on the roadmap, and exactly how each pending feature extends the architecture already shipped in sections 01–06 — no new backend, no new database, no duplicate systems.<\u002Fp>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Overall next-phase architecture<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13px; margin-top:6px; max-width:76ch;\">Every pending feature below is a new surface on the existing FastAPI backend and the existing SQL database. Nothing here introduces a second backend, a second database, or a second copy of Campaigns, Shops, Shoppers, Outreach, Tracking or Reports.<\u002Fp>\r\n          <div class=\"flow-row vertical\" style=\"margin-top:16px;\">\r\n            <div class=\"flow-box\">CLIENT LOGIN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">ACTIVE SHOPS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box accent\">GOOGLE MAP + SHOP DATA<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">LIVE \u002F AVAILABLE SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box ai\">AI SHOPPER MATCH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">AUTO-SELECTED SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box accent\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box ai\">EMAIL TEMPLATE + GENERATE WITH AI<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">OUTREACH SEQUENCE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">EMAIL EVENTS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">TRACKING<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box\">NOTIFICATIONS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box success\">REPORTS<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:12px;\">In parallel — every event on the pipeline above also lands here:<\u002Fp>\r\n          <div class=\"flow-row vertical\" style=\"margin-top:10px;\">\r\n            <div class=\"flow-box sm ai\">ALL EVENTS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm ai\">SHARED SQL DATABASE<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">ISN ADMIN PORTAL<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">USER MANAGEMENT<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUDIT LOGS<\u002Fdiv><div class=\"flow-arrow\">↓<\u002Fdiv>\r\n            <div class=\"flow-box sm\">EXPORTS<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <figure style=\"margin-top:20px;\">\r\n            <svg viewBox=\"0 0 900 300\" role=\"img\" aria-label=\"ISN Admin Portal, Client Portal and the Shopper channel all call one FastAPI backend, which branches into the SQL database, the AI engine and external integrations.\" style=\"width:100%; height:auto; color:var(--text-muted);\">\r\n              <defs><marker id=\"arrn7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\r\n              <rect x=\"50\" y=\"24\" width=\"250\" height=\"54\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"175\" y=\"47\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">ISN ADMIN PORTAL<\u002Ftext>\r\n              <text x=\"175\" y=\"63\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">User Mgmt · Tracking · Audit · Exports<\u002Ftext>\r\n\r\n              <rect x=\"340\" y=\"24\" width=\"250\" height=\"54\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"465\" y=\"47\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">CLIENT PORTAL<\u002Ftext>\r\n              <text x=\"465\" y=\"63\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">Map · Shop Match · Outreach · Reports<\u002Ftext>\r\n\r\n              <rect x=\"650\" y=\"24\" width=\"200\" height=\"54\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"750\" y=\"47\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--text)\">SHOPPER<\u002Ftext>\r\n              <text x=\"750\" y=\"63\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">Email · Assignment link<\u002Ftext>\r\n\r\n              <line x1=\"175\" y1=\"78\" x2=\"350\" y2=\"140\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n              <line x1=\"465\" y1=\"78\" x2=\"450\" y2=\"140\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n              <line x1=\"750\" y1=\"78\" x2=\"550\" y2=\"140\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n\r\n              <rect x=\"250\" y=\"140\" width=\"400\" height=\"54\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"><\u002Frect>\r\n              <text x=\"450\" y=\"163\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--accent)\">ONE FASTAPI BACKEND<\u002Ftext>\r\n              <text x=\"450\" y=\"180\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--accent)\">shared by every portal and every pending feature below<\u002Ftext>\r\n\r\n              <line x1=\"350\" y1=\"194\" x2=\"210\" y2=\"220\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n              <line x1=\"450\" y1=\"194\" x2=\"450\" y2=\"220\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n              <line x1=\"550\" y1=\"194\" x2=\"695\" y2=\"220\" stroke=\"currentColor\" marker-end=\"url(#arrn7)\"><\u002Fline>\r\n\r\n              <rect x=\"110\" y=\"222\" width=\"200\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"210\" y=\"245\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--text)\">SQL DATABASE<\u002Ftext>\r\n              <text x=\"210\" y=\"261\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">shops · shoppers · campaigns · events<\u002Ftext>\r\n\r\n              <rect x=\"350\" y=\"222\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--ai-soft)\" stroke=\"var(--ai)\"><\u002Frect>\r\n              <text x=\"450\" y=\"245\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ai-ink)\">AI ENGINE<\u002Ftext>\r\n              <text x=\"450\" y=\"261\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--ai-ink)\">shopper match + ranking<\u002Ftext>\r\n\r\n              <rect x=\"590\" y=\"222\" width=\"210\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"><\u002Frect>\r\n              <text x=\"695\" y=\"245\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--text)\">INTEGRATIONS<\u002Ftext>\r\n              <text x=\"695\" y=\"261\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">Google Maps · SendGrid · SASSIE<\u002Ftext>\r\n            <\u002Fsvg>\r\n            <figcaption>Client Portal, ISN Admin Portal and the shopper email channel all call the same FastAPI backend. Nothing in this page adds a second backend, a second database, or a second AI engine — every pending feature below is a new view over these same three boxes.<\u002Ffigcaption>\r\n          <\u002Ffigure>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Feature — campaign overview with Google Map + live shopper availability<\u002Fh3>\r\n          <p class=\"muted\" style=\"font-size:13px; margin-top:6px; max-width:76ch;\">Extends the existing Campaign → Overview tab. Each active shop in the campaign becomes a map marker, sourced from the shop's existing location fields.<\u002Fp>\r\n          <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n            <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">ACTIVE SHOPS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOP LOCATION<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm accent\">GOOGLE MAPS API<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm success\">MAP MARKERS<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">Example — Nike Mumbai Store Audit: Nike Mumbai–Bandra, Nike Mumbai–Andheri, Nike Pune–Koregaon Park, Nike Nashik–College Road each render as an independent marker.<\u002Fp>\r\n          <div class=\"card\" style=\"margin-top:14px; max-width:360px;\">\r\n            <div class=\"eyebrow\">Marker popup<\u002Fdiv>\r\n            <h3 class=\"h3\" style=\"font-size:15px; margin-top:4px;\">Nike Mumbai — Bandra<\u002Fh3>\r\n            <div class=\"grid grid-2\" style=\"margin-top:12px; gap:10px;\">\r\n              <div class=\"field\"><label>Location<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\">Mumbai, Maharashtra<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"field\"><label>Status<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\"><span class=\"pill pill-active\">Healthy<\u002Fspan><\u002Fdiv><\u002Fdiv>\r\n              <div class=\"field\"><label>Required<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\">3<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"field\"><label>Available<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\">14<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"field\"><label>Invited<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\">8<\u002Fdiv><\u002Fdiv>\r\n              <div class=\"field\"><label>Accepted<\u002Flabel><div class=\"val\" style=\"font-size:12.5px; padding:7px 9px;\">2<\u002Fdiv><\u002Fdiv>\r\n            <\u002Fdiv>\r\n            <div class=\"btn btn-primary btn-sm\" style=\"margin-top:14px;\">View Shop<\u002Fdiv>\r\n          <\u002Fdiv>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Shop marker click workflow<\u002Fh3>\r\n          <div class=\"flow-row\">\r\n            <div class=\"flow-box sm\">MAP<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOP MARKER<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm accent\">SHOP DETAIL PANEL<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Shop information<\u002Fdiv>\r\n              <div class=\"grid grid-2\" style=\"margin-top:10px; gap:8px;\">\r\n                <div class=\"field\"><label>Shop \u002F Brand<\u002Flabel><div class=\"val\" style=\"font-size:12px; padding:6px 9px;\">Nike — Bandra<\u002Fdiv><\u002Fdiv>\r\n                <div class=\"field\"><label>Address \u002F City<\u002Flabel><div class=\"val\" style=\"font-size:12px; padding:6px 9px;\">Mumbai<\u002Fdiv><\u002Fdiv>\r\n                <div class=\"field\"><label>Lat \u002F Lng<\u002Flabel><div class=\"val\" style=\"font-size:12px; padding:6px 9px;\">19.06, 72.83<\u002Fdiv><\u002Fdiv>\r\n                <div class=\"field\"><label>Campaign<\u002Flabel><div class=\"val\" style=\"font-size:12px; padding:6px 9px;\">Nike Mumbai Audit<\u002Fdiv><\u002Fdiv>\r\n                <div class=\"field\"><label>Deadline<\u002Flabel><div class=\"val\" style=\"font-size:12px; padding:6px 9px;\">25 Aug 2026<\u002Fdiv><\u002Fdiv>\r\n                <div class=\"field\"><label>Compensation<\u002Flabel><div class=\"val\" style=\"font-si "font-size:12px; font-weight:700;\">SHOP LOCATION<\u002Fdiv><div class=\"muted\" style=\"font-size:11.5px; margin-top:4px;\">→ Google Maps API<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"card\" style=\"padding:14px 16px;\"><div style=\"font-size:12px; font-weight:700;\">SHOPPER \u002F CAMPAIGN DATA<\u002Fdiv><div class=\"muted\" style=\"font-size:11.5px; margin-top:4px;\">→ Existing configured APIs \u002F SASSIE where applicable<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"card\" style=\"padding:14px 16px;\"><div style=\"font-size:12px; font-weight:700;\">EMAIL<\u002Fdiv><div class=\"muted\" style=\"font-size:11.5px; margin-top:4px;\">→ SendGrid<\u002Fdiv><\u002Fdiv>\r\n            <div class=\"card\" style=\"padding:14px 16px;\"><div style=\"font-size:12px; font-weight:700;\">AI MATCHING<\u002Fdiv><div class=\"muted\" style=\"font-size:11.5px; margin-top:4px;\">→ Existing AI Recommendation service<\u002Fdiv><\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">All external API keys stay backend-side — never exposed in frontend code.<\u002Fp>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Client Portal vs. ISN Admin Portal<\u002Fh3>\r\n          <div class=\"grid grid-2\" style=\"margin-top:14px; align-items:start;\">\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">Client Portal<\u002Fdiv>\r\n              <ul class=\"checklist\" style=\"margin-top:10px; columns:2;\">\r\n                <li>Campaigns<\u002Fli><li>Shops<\u002Fli><li>Shoppers<\u002Fli><li>AI Recommendations<\u002Fli>\r\n                <li>Outreach<\u002Fli><li>Email Templates<\u002Fli><li>Email Automation<\u002Fli><li>Tracking<\u002Fli>\r\n                <li>Notifications<\u002Fli><li>Reports<\u002Fli><li>Client-level Audit Logs<\u002Fli>\r\n              <\u002Ful>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\">ISN Admin Portal<\u002F ons<\u002Fli>\r\n              <\u002Fol>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\" style=\"color:var(--warning);\">P1 — Operational MVP<\u002Fdiv>\r\n              <ol class=\"checklist\" style=\"margin-top:10px; list-style:decimal; padding-left:16px;\">\r\n                <li style=\"display:list-item;\">Reports<\u002Fli>\r\n                <li style=\"display:list-item;\">PDF \u002F CSV \u002F XLSX exports<\u002Fli>\r\n                <li style=\"display:list-item;\">ISN User Management<\u002Fli>\r\n                <li style=\"display:list-item;\">Admin exports<\u002Fli>\r\n                <li style=\"display:list-item;\">Bulk email thresholds<\u002Fli>\r\n                <li style=\"display:list-item;\">Automation monitoring<\u002Fli>\r\n              <\u002Fol>\r\n            <\u002Fdiv>\r\n            <div class=\"card\">\r\n              <div class=\"eyebrow\" style=\"color:var(--text-faint);\">P2 — Future enhancement<\u002Fdiv>\r\n              <p class=\"muted\" style=\"font-size:12px; margin-top:10px;\">No additional future-phase items are currently documented in the product roadmap beyond P0\u002FP1 above.<\u002Fp>\r\n            <\u002Fdiv>\r\n          <\u002Fdiv>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Implementation principle<\u002Fh3>\r\n          <div style=\"display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; align-items:center;\">\r\n            <span class=\"chip\">ONE BACKEND<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">ONE SQL DATABASE<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">TWO PORTALS<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">SHARED AI<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">SHARED OUTREACH<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">SHARED EMAIL AUTOMATION<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">SHARED TRACKING<\u002Fspan><span class=\"flow-arrow\">+<\u002Fspan>\r\n            <span class=\"chip\">SHARED REPORTING<\u002Fspan>\r\n          <\u002Fdiv>\r\n          <p class=\"muted\" style=\"font-size:12.5px; margin-top:12px; max-width:76ch;\">Client Portal and ISN Admin Portal are different views \u002F permission layers over the same underlying platform. Not duplicated for:<\u002Fp>\r\n          <ul class=\"checklist\" style=\"margin-top:8px; columns:2;\">\r\n            <li>Shoppers<\u002Fli><li>Campaigns<\u002Fli><li>Tracking<\u002Fli><li>Email<\u002Fli><li>Reports<\u002Fli><li>AI<\u002Fli><li>Users<\u002Fli>\r\n          <\u002Ful>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:32px;\">Final architecture summary<\u002Fh3>\r\n          <p class=\"lede\" style=\"max-width:76ch;\">ShopperMatch.AI evolves from a campaign management interface into an integrated shopper recruitment and outreach platform. Active campaign shops become the starting point for location-aware shopper discovery. Google Maps and existing shop data provide geographic context, while the AI Recommendation engine ranks available shoppers against each shop's requirements. The highest-priority shoppers are automatically selected by default, while the client retains manual override control. Outreach then connects these selected shoppers to AI-assisted email templates, automated sequences and SendGrid delivery. Every email event flows back into the shared tracking system, generating real-time notifications and reporting data for the client while providing ISN administrators with deeper operational visibility through Tracking, User Management and Audit Logs.<\u002Fp>\r\n\r\n          <h3 class=\"h3\" style=\"margin-top:30px;\">Final visual workflow<\u002Fh3>\r\n          <div class=\"flow-row\" style=\"margin-top:14px;\">\r\n            <div class=\"flow-box sm\">CLIENT<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">CAMPAIGN<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">MAP + SHOPS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOP DETAIL<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AVAILABLE SHOPPERS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">AI MATCH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUTO SELECT<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm warning\">CLIENT OVERRIDE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">OUTREACH<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box ai\">AI EMAIL TEMPLATE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">AUTOMATION SEQUENCE<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box accent\">SENDGRID<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">SHOPPER<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">EMAIL EVENTS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">TRACKING<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm\">NOTIFICATIONS<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv>\r\n            <div class=\"flow-box sm success\">REPORTS<\u002Fdiv>\r\n          <\u002Fdiv>\r\n          <div class=\"card\" style=\"margin-top:14px; max-width:340px;\">\r\n            <div class=\"eyebrow\">Parallel — ISN Admin<\u002Fdiv>\r\n            <p class=\"muted\" style=\"font-size:11.5px; margin-top:6px;\">All system events →<\u002Fp>\r\n            <ul class=\"checklist\" style=\"margin-top:10px;\">\r\n              <li>Dashboard<\u002Fli><li>Tracking<\u002Fli><li>User Management<\u002Fli><li>Insights<\u002Fli>\r\n              <li>Audit Logs<\u002Fli><li>Integrations<\u002Fli><li>Settings<\u002Fli><li>Reports \u002F Exports<\u002Fli>\r\n            <\u002Ful>\r\n          <\u002Fdiv>\r\n        <\u002Fdiv>\r\n      <\u002Fsection>\r\n\r\n    <\u002Fdiv>\r\n  <\u002Fmain>\r\n<\u002Fdiv>\r\n\r\n<script>\r\n  const RAIL_LABELS = {\r\n    \"01\":\"Cover\",\"02\":\"Product Architecture\",\"03\":\"User Roles\",\"04\":\"End-to-End Workflows\",\"05\":\"Outreach Workflow\",\"06\":\"Email Automation Workflow\",\"07\":\"Pending Features & Next-Phase MVP Enhancements\"\r\n  };\r\n  const FRAME_LABELS = {};\r\n\r\n  function buildSwitch(rail){\r\n    const slot = document.getElementById('frame-switch-slot');\r\n    slot.innerHTML = '';\r\n    const labels = FRAME_LABELS[rail];\r\n    if(!labels){ return; }\r\n    const panel = document.getElementById('panel-'+rail);\r\n    const activeFrame = panel.querySelector('.frame.active')?.dataset.frame || Object.keys(labels)[0];\r\n    Object.keys(labels).forEach(key=>{\r\n      const b = document.createElement('button');\r\n      b.textContent = labels[key];\r\n      b.dataset.frameTarget = key;\r\n      b.setAttribute('role','tab');\r\n      b.setAttribute('aria-selected', key === activeFrame ? 'true' : 'false');\r\n      if(key === activeFrame) b.classList.add('active');\r\n      b.addEventListener('click', ()=> setFrame(rail, key));\r\n      slot.appendChild(b);\r\n    });\r\n  }\r\n\r\n  function setFrame(rail, frame){\r\n    const panel = document.getElementById('panel-'+rail);\r\n    panel.querySelectorAll('.frame').forEach(f=>f.classList.toggle('active', f.dataset.frame === frame));\r\n    buildSwitch(rail);\r\n    updateCrumb(rail, frame);\r\n  }\r\n\r\n  function updateCrumb(rail, frame){\r\n    const crumb = document.getElementById('crumb');\r\n    let txt = rail+' — '+RAIL_LABELS[rail];\r\n    if(frame && FRAME_LABELS[rail] && FRAME_LABELS[rail][frame]) txt += ' \u002F '+FRAME_LABELS[rail][frame];\r\n    crumb.innerHTML = '<b>'+txt+'<\u002Fb>';\r\n  }\r\n\r\n  function setRail(rail){\r\n    document.querySelectorAll('.rail-btn').forEach(b=>{\r\n      const isActive = b.dataset.rail===rail;\r\n      b.classList.toggle('active', isActive);\r\n      if(isActive) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');\r\n    });\r\n    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+rail));\r\n    buildSwitch(rail);\r\n    const panel = document.getElementById('panel-'+rail);\r\n    const activeFrame = panel.querySelector('.frame.active')?.dataset.frame;\r\n    updateCrumb(rail, activeFrame);\r\n    document.querySelector('.canvas').scrollTo({top:0});\r\n    window.scrollTo({top:0});\r\n  }\r\n\r\n  function goTo(rail, frame){\r\n    setRail(rail);\r\n    if(frame) setFrame(rail, frame);\r\n  }\r\n\r\n  document.querySelectorAll('.rail-btn').forEach(btn=>{\r\n    btn.addEventListener('click', ()=> setRail(btn.dataset.rail));\r\n  });\r\n  document.querySelectorAll('[data-goto]').forEach(el=>{\r\n    el.style.cursor = 'pointer';\r\n    if(el.tagName !== 'BUTTON' && el.tagName !== 'A'){\r\n      el.setAttribute('role','button');\r\n      el.tabIndex = 0;\r\n      el.addEventListener('keydown', e=>{\r\n        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }\r\n      });\r\n    }\r\n    el.addEventListener('click', ()=>{\r\n      const [rail, frame] = el.dataset.goto.split(',');\r\n      goTo(rail, frame || '');\r\n    });\r\n  });\r\n\r\n  buildSwitch('01');\r\n\r\n  \u002F* ---- Workflow pipeline (frame 04) ---- *\u002F\r\n  (function(){\r\n    const steps = [\"Campaign\",\"Shop\",\"AI Recommendation\",\"Select Shopper\",\"Outreach\",\"Email Template\",\"Generate Invitation\",\r\n                    \"SendGrid\",\"Email\",\"Tracking Link\",\"Shopper\",\"Assignment\",\"Accept \u002F Decline\",\"Database\"];\r\n    const wrap = document.getElementById('wf-render');\r\n    const rowSize = 7;\r\n    let html = '<div style=\"display:flex; flex-direction:column; gap:10px; margin-top:4px;\">';\r\n    for(let r=0; r<Math.ceil(steps.length\u002FrowSize); r++){\r\n      html += '<div style=\"display:flex; align-items:center; gap:0; flex-wrap:wrap;\">';\r\n      const slice = steps.slice(r*rowSize, r*rowSize+rowSize);\r\n      slice.forEach((s,i)=>{\r\n        html += '<div style=\"display:flex; align-items:center;\">';\r\n        html += '<div style=\"border:1px solid var(--border-strong); background:'+(s===\"AI Recommendation\"?'var(--ai-soft)':'var(--surface)')+'; border-radius:7px; padding:8px 12px; font-size:11.5px; font-weight:600; white-space:nowrap; color:'+(s===\"AI Recommendation\"?'var(--ai-ink)':'var(--text)')+';\">'+s+'<\u002Fdiv>';\r\n        if(i < slice.length-1){\r\n          html += '<div style=\"width:20px; height:1px; background:var(--text-faint); position:relative; margin:0 2px;\"><div style=\"position:absolute; right:-1px; top:-3px; border-left:5px solid var(--text-faint); border-top:3px solid transparent; border-bottom:3px solid transparent;\"><\u002Fdiv><\u002Fdiv>';\r\n        }\r\n        html += '<\u002Fdiv>';\r\n      });\r\n      html += '<\u002Fdiv>';\r\n    }\r\n    html += '<div class=\"muted\" style=\"font-size:11px; font-family:var(--font-mono);\">↳ continues to Client Status<\u002Fdiv>';\r\n    html += '<\u002Fdiv>';\r\n    wrap.innerHTML = html;\r\n    document.getElementById('wf-caption').textContent = 'Fourteen hops from a campaign requirement to a client-visible status: the AI recommendation step (highlighted) is the only one that reorders candidates rather than just moving a record forward.';\r\n  })();\r\n<\u002Fscript>\r\n<\u002Fbody><\u002Fhtml>"</script>
